<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Industry Discovery Scanner</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--border:#222;--accent:#c8f135;--red:#ff4d4d;--orange:#ffb347;--text:#f0f0f0;--muted:#999}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Syne,sans-serif;min-height:100vh;padding:40px 20px}
.container{max-width:960px;margin:0 auto}
header{border-bottom:1px solid var(--border);padding-bottom:28px;margin-bottom:34px}
.logo{font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
h1{font-size:clamp(34px,5vw,58px);font-weight:800;line-height:.92;letter-spacing:-.04em}
h1 span{color:var(--accent)}
.subtitle{margin-top:12px;color:var(--muted);font-size:13px;font-family:'DM Mono',monospace}
.card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:24px;margin-bottom:16px}
label{display:block;font-size:11px;font-family:'DM Mono',monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input,textarea,select{width:100%;background:#050505;border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;padding:12px 14px;outline:none}
textarea{resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.field{margin-bottom:20px}.field:last-child{margin-bottom:0}
.hint,.counter{margin-top:6px;font-size:11px;font-family:'DM Mono',monospace;color:var(--muted)}
.counter span{color:var(--accent)}
.keyword-row{display:flex;gap:8px}
.keyword-row input{flex:1}
.btn-small{background:#202020;border:1px solid #333;color:var(--text);border-radius:3px;padding:11px 16px;font-family:'DM Mono',monospace;cursor:pointer}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{background:#1a1a1a;border:1px solid var(--border);border-radius:3px;padding:6px 10px;font-family:'DM Mono',monospace;font-size:12px;display:flex;gap:8px;align-items:center}
.tag button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px}
.btn-run{width:100%;background:var(--accent);border:0;border-radius:3px;color:#000;font-family:Syne,sans-serif;font-weight:800;font-size:17px;padding:17px;cursor:pointer;margin-top:8px}
.btn-run:disabled{opacity:.45;cursor:not-allowed}
.status,.error{display:none;padding:14px 18px;border-radius:4px;margin-bottom:16px;font-family:'DM Mono',monospace;font-size:13px}
.status{background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.error{background:rgba(255,77,77,.08);border:1px solid rgba(255,77,77,.3);color:var(--red)}
.visible{display:block}
.results{display:none;margin-top:34px}
.summary{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:22px}
.market-card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:22px;margin-bottom:28px}
.market-title{font-size:26px;font-weight:800;margin-bottom:8px}
.market-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.stat{background:#0e0e0e;border:1px solid var(--border);padding:14px;border-radius:4px}
.stat-num{font-size:26px;font-weight:800}
.stat-label{font-family:'DM Mono',monospace;color:var(--muted);font-size:11px;margin-top:4px}
.good{color:var(--accent)}.mid{color:var(--orange)}.bad{color:var(--red)}
.section-title{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin:24px 0 8px}
.table{width:100%;border-collapse:collapse;border:1px solid var(--border);font-family:'DM Mono',monospace;font-size:12px;margin-top:8px}
.table th{background:#1a1a1a;color:var(--muted);text-align:left;padding:9px;font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.table td{border-top:1px solid var(--border);padding:8px 9px;vertical-align:top}
.table tr.target{background:rgba(200,241,53,.07)}
.badge{display:inline-block;padding:2px 7px;border-radius:2px;font-size:10px;font-weight:700}
.badge-good{background:rgba(200,241,53,.15);color:var(--accent)}
.badge-mid{background:rgba(255,179,71,.15);color:var(--orange)}
.badge-bad{background:rgba(255,77,77,.12);color:var(--red)}
.prospect{border-left:4px solid var(--accent)}
.btn-pdf{background:none;border:1px solid var(--accent);color:var(--accent);border-radius:3px;padding:8px 14px;font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.btn-pdf:hover{background:var(--accent);color:#000}
@media(max-width:800px){.market-grid{grid-template-columns:1fr 1fr}.table{font-size:10px}.keyword-row{display:block}.btn-small{width:100%;margin-top:8px}}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="logo">Industry Discovery Scanner</div>
  <h1>Find weak<br><span>local markets.</span></h1>
  <p class="subtitle">// scan top 20 Google Maps results — find weak profiles, easy traction, and call-worthy prospects</p>
</header>

<div id="inputSection">
  <div class="card">
    <div class="field">
      <label>Apify API Token</label>
      <input id="token" type="password" placeholder="apify_api_xxxx">
    </div>
  </div>

  <div class="card">
    <div class="field">
      <label>Seed Google Maps URLs — optional, one per line</label>
      <textarea id="urls" rows="4" placeholder="Optional. Paste a business Maps URL if you want to include/mark a target."></textarea>
      <div class="counter" id="urlCounter"><span>0</span> / 30 URLs</div>
      <div class="hint">// optional. The scanner can run from city alone.</div>
    </div>
  </div>

  <div class="card">
    <div class="field">
      <label>Keywords / Industries</label>
      <div class="keyword-row">
        <input id="keywordInput" placeholder="e.g. junk removal">
        <button class="btn-small" onclick="addKeyword()">+ Add</button>
      </div>
      <div class="tags" id="tags"></div>
    </div>

    <div class="field">
      <label>Search From</label>
      <select id="searchFrom" onchange="toggleCity()">
        <option value="city" selected>CITY — search keyword + city</option>
        <option value="pin">PIN — search from seed business location</option>
      </select>
      <div id="cityBox" style="display:block;margin-top:10px">
        <input id="city" placeholder="e.g. Spokane Valley">
        <div class="hint">// city mode searches “keyword + city” from the geocoded city center</div>
      </div>
    </div>

    <div class="field">
      <label>Language</label>
      <select id="language">
        <option value="en" selected>English</option>
        <option value="sv">Svenska</option>
        <option value="es">Español</option>
      </select>
    </div>
  </div>

  <button id="runBtn" class="btn-run" onclick="runScan()">▶ Run Market Scan</button>
</div>

<div id="status" class="status"></div>
<div id="error" class="error"></div>

<div id="results" class="results">
  <div id="resultsBody"></div>
</div>
</div>

<script>
const BASE='https://api.apify.com/v2';
const ACTOR='compass~crawler-google-places';
let keywords=[];
let latestMarkets=[];

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function status(msg){const el=document.getElementById('status');el.textContent=msg;el.classList.add('visible')}
function hideStatus(){document.getElementById('status').classList.remove('visible')}
function showError(msg){const el=document.getElementById('error');el.textContent='⚠ '+msg;el.classList.add('visible')}
function clearError(){document.getElementById('error').classList.remove('visible')}
function normalize(s){return String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9]/g,'')}
function parseUrls(raw){return raw.split('\n').map(u=>u.trim()).filter(u=>u.includes('google.com/maps')||u.includes('maps.app.goo.gl')||u.includes('goo.gl/maps')).slice(0,30)}
function avg(arr){const nums=arr.filter(n=>Number.isFinite(Number(n))).map(Number);return nums.length?nums.reduce((a,b)=>a+b,0)/nums.length:0}
function median(arr){const nums=arr.filter(n=>Number.isFinite(Number(n))).map(Number).sort((a,b)=>a-b);if(!nums.length)return 0;const m=Math.floor(nums.length/2);return nums.length%2?nums[m]:(nums[m-1]+nums[m])/2}

document.getElementById('urls').addEventListener('input',function(){
  const n=parseUrls(this.value).length;
  document.getElementById('urlCounter').innerHTML=`<span>${n}</span> / 30 URLs`;
});
document.getElementById('keywordInput').addEventListener('keydown',e=>{if(e.key==='Enter')addKeyword()});

function addKeyword(){
  const input=document.getElementById('keywordInput');
  const val=input.value.trim();
  if(!val||keywords.includes(val)){input.value='';return}
  keywords.push(val);input.value='';renderTags();
}
function removeKeyword(i){keywords.splice(i,1);renderTags()}
function renderTags(){document.getElementById('tags').innerHTML=keywords.map((k,i)=>`<div class="tag">${esc(k)} <button onclick="removeKeyword(${i})">×</button></div>`).join('')}
function toggleCity(){document.getElementById('cityBox').style.display=document.getElementById('searchFrom').value==='city'?'block':'none'}

async function startActor(token,input){
  const res=await fetch(`${BASE}/acts/${ACTOR}/runs?token=${encodeURIComponent(token)}`,{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input)
  });
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`Apify HTTP ${res.status}`)}
  const j=await res.json();return j.data;
}
async function pollRun(token,runId,label){
  for(let i=0;i<80;i++){
    await sleep(5000);
    const res=await fetch(`${BASE}/actor-runs/${runId}?token=${encodeURIComponent(token)}`);
    const j=await res.json();
    const s=j.data?.status;
    status(`${label} — ${s} (${(i+1)*5}s)`);
    if(s==='SUCCEEDED')return j.data.defaultDatasetId;
    if(['FAILED','ABORTED','TIMED-OUT'].includes(s))throw new Error(`${label} ${s}`);
  }
  throw new Error(`${label} timed out`);
}
async function fetchDataset(token,datasetId,limit=500){
  const res=await fetch(`${BASE}/datasets/${datasetId}/items?token=${encodeURIComponent(token)}&clean=true&limit=${limit}`);
  return await res.json();
}
async function runActor(token,input,label,limit=500){
  const run=await startActor(token,input);
  const datasetId=await pollRun(token,run.id,label);
  return await fetchDataset(token,datasetId,limit);
}
async function geocodeCity(city){
  const res=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1`);
  const j=await res.json();
  if(!j||!j[0])throw new Error(`Could not geocode city: ${city}`);
  return {lat:Number(j[0].lat),lng:Number(j[0].lon)};
}
function profileLatLng(profile){
  const lat=profile?.location?.lat??profile?.latitude??profile?.lat;
  const lng=profile?.location?.lng??profile?.longitude??profile?.lng;
  if(lat==null||lng==null)return null;
  return {lat:Number(lat),lng:Number(lng)};
}
function canonicalName(s){
  return normalize(String(s||'').replace(/\b(llc|inc|ltd|co|company|corp|corporation|ab|gmbh)\b/gi,' ').replace(/\b(the|of|in|near|at)\b/gi,' ').replace(/\s+/g,' '));
}
function wordMatchScore(a,b){
  const A=canonicalName(a),B=canonicalName(b);
  if(!A||!B)return 0;
  if(A===B)return 1;
  if(A.includes(B)||B.includes(A))return .95;
  const wordsA=String(a||'').toLowerCase().split(/\s+/).map(canonicalName).filter(w=>w.length>2);
  const wordsB=String(b||'').toLowerCase().split(/\s+/).map(canonicalName).filter(w=>w.length>2);
  if(!wordsA.length||!wordsB.length)return 0;
  let hits=0;
  for(const w of wordsA){if(wordsB.some(x=>x===w||x.includes(w)||w.includes(x)))hits++}
  return hits/Math.max(wordsA.length,wordsB.length);
}
function isSameBusiness(item,profile){
  if(!profile)return false;
  const itemPlaceId=item.placeId||item.place_id||item.cid;
  const profilePlaceId=profile.placeId||profile.place_id||profile.cid;
  if(itemPlaceId&&profilePlaceId&&String(itemPlaceId)===String(profilePlaceId))return true;
  return wordMatchScore(item.title||item.name||'',profile.title||profile.name||'')>=0.6;
}
function getCategories(item){
  const out=[];const add=x=>{if(!x)return;if(typeof x==='string')out.push(x.trim());else if(typeof x==='object')out.push(String(x.name||x.title||x.label||x.categoryName||'').trim())};
  if(Array.isArray(item.categories))item.categories.forEach(add);
  if(Array.isArray(item.additionalCategories))item.additionalCategories.forEach(add);
  add(item.categoryName);add(item.category);
  return [...new Set(out.filter(Boolean))];
}
function getPrimaryCategory(item){const cats=getCategories(item);return item?.categoryName||item?.category||cats[0]||'Unknown'}
function getSecondaryCategories(item){const primary=getPrimaryCategory(item);return getCategories(item).filter(c=>c&&c!==primary)}
function hasWebsite(item){return !!(item.website&&String(item.website).trim())}
function hasPhone(item){return !!(item.phone||item.phoneUnformatted)}
function hasHours(item){return !!(item.openingHours&&item.openingHours.length)}
function photoCount(item){return item.imageCount||item.imagesCount||item.photosCount||(Array.isArray(item.imageUrls)?item.imageUrls.length:0)||0}
function hasDescription(item){return !!(item.description&&String(item.description).trim().length>=120)}
function hasServices(item){return !!(item.services?.length||item.additionalInfo?.Services||item.additionalInfo)}
function hasPosts(item){return !!(item.posts?.length||item.updatesFromCustomers?.length||item.updatesCount)}

function getProfileScore(b){
  let score=0;

  if(b.primaryCategory&&b.primaryCategory!=='Unknown')score+=18;
  if((b.secondaryCategories||[]).length>=3)score+=12;
  else if((b.secondaryCategories||[]).length>=1)score+=5;

  if(b.hasDescription)score+=12;
  if(b.reviews>=100)score+=18;
  else if(b.reviews>=50)score+=14;
  else if(b.reviews>=20)score+=10;
  else if(b.reviews>=10)score+=6;

  if(b.rating>=4.8&&b.reviews>=10)score+=10;
  else if(b.rating>=4.5&&b.reviews>=10)score+=7;
  else if(b.rating>=4.0&&b.reviews>=5)score+=4;

  if(b.photos>=30)score+=10;
  else if(b.photos>=10)score+=7;
  else if(b.photos>=3)score+=3;

  if(b.hasWebsite)score+=8;
  else score-=20;

  if(b.hasPhone)score+=5;
  if(b.hasAddress)score+=5;
  if(b.hasHours)score+=5;
  if(b.hasServices)score+=3;
  if(b.hasPosts)score+=2;

  return Math.max(0,Math.min(100,Math.round(score)));
}

function getTractionDifficulty(b,allBusinesses){
  const above=allBusinesses.filter(x=>x.rank<b.rank);
  if(!above.length)return 100;

  const avgAboveScore=avg(above.map(x=>x.profileScore));
  const avgAboveReviews=avg(above.map(x=>x.reviews));
  const strongAbove=above.filter(x=>x.profileScore>=70||x.reviews>=200).length;
  const weakAbove=above.filter(x=>x.profileScore<50).length;

  let difficulty=0;
  difficulty+=avgAboveScore*0.45;
  difficulty+=Math.min(35,avgAboveReviews/10);
  difficulty+=strongAbove*6;
  difficulty-=weakAbove*5;

  return Math.max(0,Math.min(100,Math.round(difficulty)));
}

function getIPPScore(b,allBusinesses){
  let score=0;

  if(b.rank>=8&&b.rank<=15)score+=30;
  else if(b.rank>=6&&b.rank<=7)score+=15;
  else if(b.rank>=16&&b.rank<=20)score+=10;

  if(!b.hasWebsite)score+=20;
  else if(b.profileScore<55)score+=10;

  if(b.rating>=4.8&&b.reviews>=10)score+=20;
  else if(b.rating>=4.5&&b.reviews>=10)score+=10;

  if(b.reviews>=15&&b.reviews<=60)score+=20;
  else if(b.reviews>=10&&b.reviews<=14)score+=10;
  else if(b.reviews>=61&&b.reviews<=100)score+=10;

  score+=(100-b.profileScore)*0.25;

  const difficulty=getTractionDifficulty(b,allBusinesses);
  if(difficulty<40)score+=20;
  else if(difficulty<60)score+=10;
  else if(difficulty>80)score-=15;

  return Math.max(0,Math.min(100,Math.round(score)));
}

// ─────────────────────────────────────────────────────────────────────
// WEBSITE WEAKNESS SCORING
// Fetches the prospect's homepage and parses cheap signals to determine
// how "brochure-like" the site is. Higher score = weaker site = better
// pitch opportunity ("your site doesn't rank because of X, Y, Z").
// Only runs for IPP candidates to keep the tool fast.
// ─────────────────────────────────────────────────────────────────────

const CORS_PROXIES=[
  url=>`https://corsproxy.io/?${encodeURIComponent(url)}`,
  url=>`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
];

async function fetchHtml(url,timeoutMs=12000){
  // try each proxy in order until one works
  for(const proxy of CORS_PROXIES){
    try{
      const ctrl=new AbortController();
      const t=setTimeout(()=>ctrl.abort(),timeoutMs);
      const res=await fetch(proxy(url),{signal:ctrl.signal});
      clearTimeout(t);
      if(!res.ok)continue;
      const html=await res.text();
      if(html&&html.length>200)return {ok:true,html,status:res.status};
    }catch(e){}
  }
  return {ok:false,html:'',status:0};
}

async function fetchSitemap(siteUrl,timeoutMs=8000){
  try{
    const u=new URL(siteUrl);
    const sitemapUrl=`${u.protocol}//${u.host}/sitemap.xml`;
    const r=await fetchHtml(sitemapUrl,timeoutMs);
    if(!r.ok)return {pageCount:null,servicePageCount:null};
    const urls=Array.from(r.html.matchAll(/<loc>([^<]+)<\/loc>/gi)).map(m=>m[1]);
    const servicePages=urls.filter(u=>/\/services?\//i.test(u)||/\/(plumb|paint|hvac|roof|electric|clean|repair|install|service)/i.test(u));
    return {pageCount:urls.length||null,servicePageCount:servicePages.length};
  }catch(e){return {pageCount:null,servicePageCount:null}}
}

async function fetchPageSpeed(url){
  // Google PageSpeed Insights API — free, no key needed for low volume
  try{
    const api=`https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=${encodeURIComponent(url)}&strategy=mobile&category=performance`;
    const ctrl=new AbortController();
    const t=setTimeout(()=>ctrl.abort(),20000);
    const res=await fetch(api,{signal:ctrl.signal});
    clearTimeout(t);
    if(!res.ok)return null;
    const data=await res.json();
    const score=data?.lighthouseResult?.categories?.performance?.score;
    return typeof score==='number'?Math.round(score*100):null;
  }catch(e){return null}
}

function analyzeHtml(html,siteUrl,city,keyword){
  if(!html)return null;
  const lower=html.toLowerCase();
  const cityLower=(city||'').toLowerCase();
  const kwLower=(keyword||'').toLowerCase();

  // Title
  const titleMatch=html.match(/<title[^>]*>([\s\S]*?)<\/title>/i);
  const title=titleMatch?titleMatch[1].replace(/\s+/g,' ').trim():'';
  const titleLower=title.toLowerCase();

  // H1
  const h1Match=html.match(/<h1[^>]*>([\s\S]*?)<\/h1>/i);
  const h1=h1Match?h1Match[1].replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim():'';
  const h1Lower=h1.toLowerCase();

  // Schema detection (JSON-LD)
  const ldMatches=Array.from(html.matchAll(/<script[^>]*type=["']application\/ld\+json["'][^>]*>([\s\S]*?)<\/script>/gi));
  let localBusinessSchema=false,serviceSchema=false,faqSchema=false,breadcrumbSchema=false;
  for(const m of ldMatches){
    const txt=m[1];
    if(/"@type"\s*:\s*"(LocalBusiness|Plumber|RoofingContractor|HVACBusiness|Electrician|HousePainter|HomeAndConstructionBusiness|ProfessionalService|GeneralContractor)"/i.test(txt))localBusinessSchema=true;
    if(/"@type"\s*:\s*"Service"/i.test(txt))serviceSchema=true;
    if(/"@type"\s*:\s*"FAQPage"/i.test(txt))faqSchema=true;
    if(/"@type"\s*:\s*"BreadcrumbList"/i.test(txt))breadcrumbSchema=true;
  }

  // Open Graph
  const ogTitle=/<meta[^>]+property=["']og:title["']/i.test(html);
  const ogImage=/<meta[^>]+property=["']og:image["']/i.test(html);
  const openGraph=ogTitle&&ogImage;

  // Mobile viewport
  const mobileViewport=/<meta[^>]+name=["']viewport["'][^>]*content=["'][^"']*width=device-width/i.test(html);

  // HTTPS
  const https=siteUrl.startsWith('https://');

  // CMS / generator detection
  let generator='';
  const genMatch=html.match(/<meta[^>]+name=["']generator["'][^>]*content=["']([^"']+)["']/i);
  if(genMatch)generator=genMatch[1];
  else if(/wp-content|wp-includes/i.test(html))generator='WordPress';
  else if(/static\.wixstatic\.com|wix\.com/i.test(html))generator='Wix';
  else if(/squarespace/i.test(lower))generator='Squarespace';
  else if(/cdn\.shopify\.com/i.test(html))generator='Shopify';
  else if(/webflow\.com/i.test(html))generator='Webflow';

  // Word count (strip tags + scripts/styles first)
  const stripped=html
    .replace(/<script[\s\S]*?<\/script>/gi,'')
    .replace(/<style[\s\S]*?<\/style>/gi,'')
    .replace(/<[^>]+>/g,' ')
    .replace(/\s+/g,' ');
  const wordCount=stripped.split(' ').filter(w=>w.length>1).length;

  // Phone presence
  const phoneVisible=/(\+?\d[\d\s\-().]{7,})/.test(stripped)&&/tel:|phone|call|ring/i.test(html);

  // Address / city presence
  const cityVisible=cityLower?stripped.toLowerCase().includes(cityLower):false;

  // Form detection
  const formDetected=/<form[\s>]/i.test(html)||/<input[^>]+type=["']email["']/i.test(html);

  // Keyword/city in title and h1
  const titleHasCity=cityLower?titleLower.includes(cityLower):false;
  const titleHasKeyword=kwLower?kwLower.split(/\s+/).some(w=>w.length>2&&titleLower.includes(w)):false;
  const h1HasCity=cityLower?h1Lower.includes(cityLower):false;
  const h1HasKeyword=kwLower?kwLower.split(/\s+/).some(w=>w.length>2&&h1Lower.includes(w)):false;

  return {
    title,h1,
    https,mobileViewport,
    localBusinessSchema,serviceSchema,faqSchema,breadcrumbSchema,
    openGraph,generator,
    wordCount,
    phoneVisible,cityVisible,formDetected,
    titleHasCity,titleHasKeyword,h1HasCity,h1HasKeyword
  };
}

function getWebsiteWeaknessScore(s){
  if(!s)return null;
  let score=0;

  // Schema absence — strongest signal that no SEO work was done
  if(!s.localBusinessSchema)score+=25;
  if(!s.serviceSchema)score+=15;
  if(!s.faqSchema)score+=8;
  if(!s.breadcrumbSchema)score+=5;

  // Title and H1 don't target city + service
  if(!s.titleHasCity)score+=8;
  if(!s.titleHasKeyword)score+=8;
  if(!s.h1HasCity)score+=6;
  if(!s.h1HasKeyword)score+=6;

  // Site size
  if(s.pageCount===1)score+=25;
  else if(s.pageCount&&s.pageCount<4)score+=15;
  else if(!s.pageCount)score+=10; // no sitemap = probably small

  // Service pages (real SEO sites have these)
  if(s.servicePageCount===0||s.servicePageCount===null)score+=10;

  // Content depth
  if(s.wordCount<300)score+=10;
  else if(s.wordCount<600)score+=5;

  // Trust + technical
  if(!s.phoneVisible)score+=5;
  if(!s.formDetected)score+=5;
  if(!s.https)score+=20;
  if(!s.mobileViewport)score+=15;
  if(!s.openGraph)score+=4;

  // PageSpeed (if available)
  if(typeof s.pageSpeedMobile==='number'){
    if(s.pageSpeedMobile<30)score+=12;
    else if(s.pageSpeedMobile<50)score+=8;
    else if(s.pageSpeedMobile<70)score+=4;
  }

  // Builder hints (Wix/Squarespace skew toward brochures)
  if(s.generator==='Wix'||s.generator==='Squarespace')score+=4;

  return Math.min(100,Math.max(0,Math.round(score)));
}

async function analyzeWebsite(siteUrl,city,keyword){
  if(!siteUrl)return null;
  // normalize
  let url=siteUrl.trim();
  if(!/^https?:\/\//i.test(url))url='https://'+url;

  const [htmlResult,sitemapData,pageSpeed]=await Promise.all([
    fetchHtml(url),
    fetchSitemap(url),
    fetchPageSpeed(url)
  ]);

  if(!htmlResult.ok){
    // site unreachable — that itself is a strong "weak" signal
    return {
      reachable:false,url,
      pageSpeedMobile:pageSpeed,
      ...sitemapData,
      weaknessScore:90 // unreachable = very weak
    };
  }

  const analysis=analyzeHtml(htmlResult.html,url,city,keyword);
  const combined={
    reachable:true,url,
    pageSpeedMobile:pageSpeed,
    ...sitemapData,
    ...analysis
  };
  combined.weaknessScore=getWebsiteWeaknessScore(combined);
  return combined;
}

function buildPitchAngle(b){
  if(!b.website)return 'No website at all — start from zero.';
  const w=b.websiteAnalysis;
  if(!w)return 'Website not yet analyzed.';
  if(!w.reachable)return 'Their website is unreachable — broken or abandoned.';

  const issues=[];
  if(!w.localBusinessSchema)issues.push('no LocalBusiness schema');
  if(!w.serviceSchema)issues.push('no Service schema');
  if(!w.titleHasCity)issues.push('city missing from title tag');
  if(!w.h1HasCity)issues.push('city missing from H1');
  if(w.pageCount&&w.pageCount<4)issues.push(`only ${w.pageCount} pages indexed`);
  if(w.servicePageCount===0)issues.push('no dedicated service pages');
  if(w.wordCount&&w.wordCount<300)issues.push('thin homepage content');
  if(typeof w.pageSpeedMobile==='number'&&w.pageSpeedMobile<50)issues.push(`slow mobile (PageSpeed ${w.pageSpeedMobile})`);
  if(w.generator==='Wix'||w.generator==='Squarespace')issues.push(`${w.generator} template`);

  if(!issues.length)return 'Their website is reasonable — focus pitch on GBP gaps.';
  return `Their site looks fine but doesn't rank: ${issues.slice(0,4).join(', ')}.`;
}

function getFinalProspectScore(b){
  // IPP already incorporates traction difficulty, so weight 65/35 with weakness
  const ipp=b.ippScore||0;
  const weakness=b.websiteAnalysis?.weaknessScore;
  if(typeof weakness!=='number')return ipp; // no website data = use IPP only
  return Math.round(ipp*0.65+weakness*0.35);
}

function buildCategoriesCounter(businesses){
  const primary={},secondary={};
  for(const b of businesses.slice(0,20)){
    primary[b.primaryCategory]=(primary[b.primaryCategory]||0)+1;
    for(const cat of b.secondaryCategories||[])secondary[cat]=(secondary[cat]||0)+1;
  }
  return {
    primary:Object.entries(primary).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])),
    secondary:Object.entries(secondary).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))
  };
}

function makeBusiness(item,rank,targetProfile){
  const b={
    rank,
    item,
    name:item.title||item.name||'(unknown)',
    rating:Number(item.totalScore??item.rating??0),
    reviews:Number(item.reviewsCount??item.reviewCount??0),
    website:item.website||'',
    hasWebsite:hasWebsite(item),
    primaryCategory:getPrimaryCategory(item),
    secondaryCategories:getSecondaryCategories(item),
    categories:getCategories(item),
    photos:photoCount(item),
    hasDescription:hasDescription(item),
    hasPhone:hasPhone(item),
    hasAddress:!!item.address,
    hasHours:hasHours(item),
    hasServices:hasServices(item),
    hasPosts:hasPosts(item),
    isTarget:isSameBusiness(item,targetProfile)
  };
  b.profileScore=getProfileScore(b);
  return b;
}

function getMarketScore(businesses){
  const top5=businesses.slice(0,5);
  const top10=businesses.slice(0,10);
  const leader=businesses[0]||{};
  const avgTop5=avg(top5.map(b=>b.reviews));
  const weakTop10=top10.filter(b=>b.profileScore<50||!b.hasWebsite).length;
  const candidates=businesses.filter(b=>b.ippScore>=65).length;

  // detect giants anywhere in top 20 — they will eventually dominate
  const giants1000=businesses.filter(b=>b.reviews>=1000).length;
  const giants500=businesses.filter(b=>b.reviews>=500).length;

  let score=0;
  if((leader.reviews||0)<200)score+=35;
  else if((leader.reviews||0)<500)score+=15;
  else if((leader.reviews||0)>1000)score-=25;

  if(avgTop5<100)score+=30;
  else if(avgTop5<200)score+=15;
  else if(avgTop5>500)score-=20;

  score+=weakTop10*4;
  score+=candidates*10;

  // CRITICAL: any giant in top 20 = market is gravitationally pulled toward them
  if(giants1000>=1)score*=0.5;       // market killer
  else if(giants500>=2)score*=0.7;   // heavy competition

  return Math.max(0,Math.min(100,Math.round(score)));
}

function getVerdict(score){
  if(score>=70)return {text:'OPEN MARKET',cls:'good'};
  if(score>=45)return {text:'MIXED / TEST CAREFULLY',cls:'mid'};
  return {text:'HARD / SKIP',cls:'bad'};
}

async function runScan(){
  clearError();hideStatus();document.getElementById('results').style.display='none';

  const token=document.getElementById('token').value.trim();
  const urls=parseUrls(document.getElementById('urls').value);
  const searchFrom=document.getElementById('searchFrom').value;
  const city=document.getElementById('city').value.trim();
  const lang=document.getElementById('language').value;

  if(!token)return showError('Apify token is required.');
  if(!keywords.length)return showError('Add at least one keyword.');
  if(searchFrom==='city'&&!city)return showError('Enter city.');
  if(searchFrom==='pin'&&!urls.length)return showError('PIN mode needs at least one Google Maps URL.');

  const btn=document.getElementById('runBtn');btn.disabled=true;

  try{
    let cityCoords=null;
    if(searchFrom==='city'){
      status(`Geocoding ${city}`);
      cityCoords=await geocodeCity(city);
    }

    let targetProfiles=[];
    if(urls.length){
      for(let i=0;i<urls.length;i++){
        status(`Fetching seed profile ${i+1}/${urls.length}`);
        const profiles=await runActor(token,{
          startUrls:[{url:urls[i]}],
          maxCrawledPlacesPerSearch:1,
          language:lang,
          maxReviews:0,
          maxImages:0,
          scrapeReviewerInfo:false
        },`Seed profile ${i+1}`,20);
        if(profiles&&profiles[0])targetProfiles.push(profiles[0]);
      }
    }

    const markets=[];

    for(let k=0;k<keywords.length;k++){
      const keyword=keywords[k];

      let lat,lng,query,label;
      if(searchFrom==='city'){
        lat=cityCoords.lat;lng=cityCoords.lng;
        query=`${keyword} ${city}`;
        label=`${keyword} — ${city}`;
      }else{
        const profile=targetProfiles[0];
        const coords=profileLatLng(profile);
        if(!coords)throw new Error('Could not get seed profile coordinates.');
        lat=coords.lat;lng=coords.lng;
        query=keyword;
        label=`${keyword} — PIN`;
      }

      status(`Scanning top 20: ${label}`);

      const results=await runActor(token,{
        searchStringsArray:[query],
        lat:String(lat),
        lng:String(lng),
        zoom:searchFrom==='city'?12:14,
        maxCrawledPlacesPerSearch:20,
        language:lang,
        maxReviews:0,
        maxImages:0,
        scrapeReviewerInfo:false,
        scrapeContacts:false,
        exportPlaceUrls:false,
        additionalInfo:false
      },`Market scan ${k+1}/${keywords.length}`,300);

      const items=(results||[]).sort((a,b)=>(a.rank??999)-(b.rank??999)).slice(0,20);
      let businesses=items.map((item,i)=>makeBusiness(item,i+1,targetProfiles[0]||null));

      for(const b of businesses){
        b.tractionDifficulty=getTractionDifficulty(b,businesses);
        b.ippScore=getIPPScore(b,businesses);
      }

      const marketScore=getMarketScore(businesses);
      const verdict=getVerdict(marketScore);
      const top10=businesses.slice(0,10);
      const candidates=businesses.filter(b=>b.ippScore>=65).sort((a,b)=>b.ippScore-a.ippScore);
      const counter=buildCategoriesCounter(businesses);

      // Phase 2: analyze every candidate's website. No gate — if we found a
      // candidate, we want to know what their site looks like.
      const candidatesWithSites=candidates.filter(b=>b.website);
      if(candidatesWithSites.length){
        status(`${label}: analyzing ${candidatesWithSites.length} candidate website(s)`);
        const cityForCheck=searchFrom==='city'?city:'';
        await Promise.all(candidatesWithSites.map(async b=>{
          try{
            b.websiteAnalysis=await analyzeWebsite(b.website,cityForCheck,keyword);
          }catch(e){
            console.error('Website analysis failed for',b.name,e);
            b.websiteAnalysis={reachable:false,weaknessScore:90};
          }
        }));
      }

      // Final score + pitch angle for every candidate (with or without site analysis)
      for(const b of candidates){
        b.finalScore=getFinalProspectScore(b);
        b.pitchAngle=buildPitchAngle(b);
      }
      // Re-sort candidates by final score (IPP + website weakness combined)
      candidates.sort((a,b)=>b.finalScore-a.finalScore);

      markets.push({
        keyword,city,query,label,searchFrom,businesses,marketScore,verdict,candidates,counter,
        leader:businesses[0]||null,
        avgTop5Reviews:Math.round(avg(businesses.slice(0,5).map(b=>b.reviews))),
        medianTop10Reviews:Math.round(median(top10.map(b=>b.reviews))),
        weakTop10:top10.filter(b=>b.profileScore<50||!b.hasWebsite).length
      });
    }

    latestMarkets=markets;
    hideStatus();
    renderMarkets(markets);

  }catch(e){hideStatus();showError(e.message)}
  finally{btn.disabled=false}
}

function scoreClass(n){return n>=70?'good':n>=45?'mid':'bad'}
function profileBadge(score){return `<span class="badge ${score>=70?'badge-good':score>=50?'badge-mid':'badge-bad'}">${score}%</span>`}
function ippBadge(score){return `<span class="badge ${score>=65?'badge-good':score>=40?'badge-mid':'badge-bad'}">${score}</span>`}
function weaknessBadge(score){
  if(typeof score!=='number')return '<span style="color:var(--muted)">—</span>';
  // Higher weakness = better prospect, so colors are inverted vs other badges
  return `<span class="badge ${score>=60?'badge-good':score>=35?'badge-mid':'badge-bad'}">${score}</span>`;
}
function finalBadge(score){
  if(typeof score!=='number')return '<span style="color:var(--muted)">—</span>';
  return `<span class="badge ${score>=65?'badge-good':score>=45?'badge-mid':'badge-bad'}">${score}</span>`;
}

function renderMarkets(markets){

  markets.forEach((m,idx)=>{
    html+=`
    <div class="market-card">
      <div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start">
        <div>
          <div class="market-title">${esc(m.label)}</div>
          <div class="summary">// query: "${esc(m.query)}" · mode: ${esc(m.searchFrom.toUpperCase())}</div>
        </div>
        <button class="btn-pdf" onclick="openMarketPdf(${idx})">Open PDF</button>
      </div>

      <div class="market-grid">
        <div class="stat"><div class="stat-num ${m.verdict.cls}">${m.marketScore}</div><div class="stat-label">market openness</div></div>
        <div class="stat"><div class="stat-num ${m.verdict.cls}">${m.verdict.text}</div><div class="stat-label">verdict</div></div>
        <div class="stat"><div class="stat-num">${m.candidates.length}</div><div class="stat-label">IPP candidates</div></div>
        <div class="stat"><div class="stat-num">${m.weakTop10}/10</div><div class="stat-label">weak top 10</div></div>
        <div class="stat"><div class="stat-num">${m.leader?.reviews??0}</div><div class="stat-label">leader reviews</div></div>
        <div class="stat"><div class="stat-num">${m.avgTop5Reviews}</div><div class="stat-label">avg top 5 reviews</div></div>
        <div class="stat"><div class="stat-num">${m.medianTop10Reviews}</div><div class="stat-label">median top 10 reviews</div></div>
        <div class="stat"><div class="stat-num">${m.businesses.filter(b=>!b.hasWebsite).length}/20</div><div class="stat-label">no website</div></div>
      </div>

      <div class="section-title">// call list — best IPP prospects</div>
      <table class="table">
        <thead><tr><th>Rank</th><th>Business</th><th>Final</th><th>IPP</th><th>Profile</th><th>Site Weakness</th><th>Rating</th><th>Reviews</th><th>Phone</th><th>Website</th><th>Pitch Angle</th></tr></thead>
        <tbody>
          ${m.candidates.length?m.candidates.map(b=>renderProspectRow(b)).join(''):`<tr><td colspan="9">No strong IPP candidates found.</td></tr>`}
        </tbody>
      </table>

      <div class="section-title">// top 20 competitor analysis</div>
      <table class="table">
        <thead><tr><th>#</th><th>Name</th><th>Profile</th><th>IPP</th><th>Traction difficulty</th><th>Rating</th><th>Reviews</th><th>Website</th><th>Primary category</th></tr></thead>
        <tbody>${m.businesses.map(b=>renderBusinessRow(b)).join('')}</tbody>
      </table>
    </div>`;
  });

  document.getElementById('resultsBody').innerHTML=html;
  document.getElementById('results').style.display='block';
  document.getElementById('results').scrollIntoView({behavior:'smooth'});
}

function renderBusinessRow(b){
  return `<tr class="${b.isTarget?'target':''}">
    <td>${b.rank}</td>
    <td><strong>${esc(b.name)}</strong>${b.isTarget?' ◀ TARGET':''}</td>
    <td>${profileBadge(b.profileScore)}</td>
    <td>${ippBadge(b.ippScore)}</td>
    <td><span class="${scoreClass(100-b.tractionDifficulty)}">${b.tractionDifficulty}/100</span></td>
    <td>${b.rating?`★ ${b.rating.toFixed(1)}`:'—'}</td>
    <td>${b.reviews}</td>
    <td>${b.hasWebsite?'Yes':'<span class="bad">No</span>'}</td>
    <td>${esc(b.primaryCategory)}</td>
  </tr>`;
}

function renderProspectRow(b){
  const phone=b.item.phone||b.item.phoneUnformatted||'—';
  const websiteCell=b.website
    ? `<a href="${esc(b.website)}" target="_blank" rel="noopener">Site</a>`
    : '<span class="bad">No</span>';
  const weakness=b.websiteAnalysis?.weaknessScore;
  const pitch=b.pitchAngle||'—';
  return `<tr class="prospect">
    <td>${b.rank}</td>
    <td><strong>${esc(b.name)}</strong></td>
    <td>${finalBadge(b.finalScore)}</td>
    <td>${ippBadge(b.ippScore)}</td>
    <td>${profileBadge(b.profileScore)}</td>
    <td>${weaknessBadge(weakness)}</td>
    <td>${b.rating?`★ ${b.rating.toFixed(1)}`:'—'}</td>
    <td>${b.reviews}</td>
    <td>${esc(phone)}</td>
    <td>${websiteCell}</td>
    <td style="max-width:280px;font-size:11px;line-height:1.4">${esc(pitch)}</td>
  </tr>`;
}

function openMarketPdf(index){
  const m=latestMarkets[index];
  if(!m)return;
  const html=buildMarketPdf(m);
  const win=window.open('','_blank');
  win.document.write(html);
  win.document.close();
  win.document.title=`${m.label} — Market Scan`;
}
