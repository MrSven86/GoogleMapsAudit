<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Google Maps Rank Checker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--surface:#141414;--border:#222;--accent:#c8f135;--red:#ff4d4d;--orange:#ffb347;--text:#f0f0f0;--muted:#999}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Syne,sans-serif;min-height:100vh;padding:40px 20px}
.container{max-width:860px;margin:0 auto}
header{border-bottom:1px solid var(--border);padding-bottom:28px;margin-bottom:34px}
.logo{font-size:11px;font-family:'DM Mono',monospace;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;margin-bottom:12px}
h1{font-size:clamp(34px,5vw,58px);font-weight:800;line-height:.92;letter-spacing:-.04em}
h1 span{color:var(--accent)}
.subtitle{margin-top:12px;color:var(--muted);font-size:13px;font-family:'DM Mono',monospace}
.card{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:24px;margin-bottom:16px}
label{display:block;font-size:11px;font-family:'DM Mono',monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input,textarea,select{width:100%;background:#050505;border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;padding:12px 14px;outline:none}
textarea{resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
.field{margin-bottom:20px}.field:last-child{margin-bottom:0}
.hint,.counter{margin-top:6px;font-size:11px;font-family:'DM Mono',monospace;color:var(--muted)}
.counter span{color:var(--accent)}
.keyword-row{display:flex;gap:8px}
.keyword-row input{flex:1}
.btn-small{background:#202020;border:1px solid #333;color:var(--text);border-radius:3px;padding:11px 16px;font-family:'DM Mono',monospace;cursor:pointer}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{background:#1a1a1a;border:1px solid var(--border);border-radius:3px;padding:6px 10px;font-family:'DM Mono',monospace;font-size:12px;display:flex;gap:8px;align-items:center}
.tag button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px}
.btn-run{width:100%;background:var(--accent);border:0;border-radius:3px;color:#000;font-family:Syne,sans-serif;font-weight:800;font-size:17px;padding:17px;cursor:pointer;margin-top:8px}
.btn-run:disabled{opacity:.45;cursor:not-allowed}
.status,.error{display:none;padding:14px 18px;border-radius:4px;margin-bottom:16px;font-family:'DM Mono',monospace;font-size:13px}
.status{background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.error{background:rgba(255,77,77,.08);border:1px solid rgba(255,77,77,.3);color:var(--red)}
.visible{display:block}
.results{display:none;margin-top:34px}
.summary{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-bottom:22px}
.biz-block{border-top:1px solid var(--border);padding-top:28px;margin-bottom:42px}
.biz-block:first-child{border-top:0;padding-top:0}
.biz-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:10px}
.biz-title{font-size:22px;font-weight:800;margin-bottom:4px}
.biz-meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);line-height:1.5}
.btn-pdf{background:none;border:1px solid var(--accent);color:var(--accent);border-radius:3px;padding:8px 14px;font-family:'DM Mono',monospace;font-size:11px;cursor:pointer;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.btn-pdf:hover{background:var(--accent);color:#000}
.keyword-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin:22px 0 8px}
.rank-hero{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:20px 24px;margin-bottom:10px;display:flex;align-items:center;gap:20px}
.rank-number{font-size:58px;font-weight:800;line-height:1;min-width:115px}
.good{color:var(--accent)}.mid{color:var(--orange)}.bad{color:var(--red)}
.rank-desc{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);line-height:1.5}
.list{border:1px solid var(--border);border-radius:4px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row.target{background:rgba(200,241,53,.08);border-left:3px solid var(--accent)}
.pos{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);width:30px;text-align:right}
.name{flex:1;font-size:13px;font-weight:700}
.row.target .pos,.row.target .name{color:var(--accent)}
.rating{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}
.notfound{padding:12px 14px;background:rgba(255,77,77,.06);font-family:'DM Mono',monospace;font-size:12px;color:var(--red);border-top:1px solid rgba(255,77,77,.16)}
.checklist{margin-top:16px;border:1px solid var(--border);border-radius:4px;overflow:hidden;font-family:'DM Mono',monospace;font-size:12px}
.check-row{display:grid;grid-template-columns:1.1fr 1fr 1.7fr;border-bottom:1px solid var(--border)}
.check-row:last-child{border-bottom:0}
.check-row div{padding:9px 12px}
.check-head{background:#1a1a1a;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}
.ok{color:var(--accent);font-weight:700}.no{color:var(--red);font-weight:700}
@media(max-width:720px){.keyword-row{display:block}.btn-small{width:100%;margin-top:8px}.rank-hero{align-items:flex-start}.check-row{grid-template-columns:1fr}.biz-head{display:block}.btn-pdf{margin-top:10px;width:100%}}
</style>
</head>
<body>
<div class="container">
<header>
  <div class="logo">Maps Rank Checker</div>
  <h1>Where do you<br>actually <span>rank?</span></h1>
  <p class="subtitle">// paste up to 30 Google Maps URLs — fetch profile first, then rank-check top 20</p>
</header>

<div id="inputSection">
  <div class="card">
    <div class="field">
      <label>Apify API Token</label>
      <input id="token" type="password" placeholder="apify_api_xxxx">
    </div>
  </div>

  <div class="card">
    <div class="field">
      <label>Google Maps URLs — one per line</label>
      <textarea id="urls" rows="7" placeholder="https://www.google.com/maps/place/..."></textarea>
      <div class="counter" id="urlCounter"><span>0</span> / 30 URLs</div>
      <div class="hint">// full Google Maps URLs work best</div>
    </div>
  </div>

  <div class="card">
    <div class="field">
      <label>Keywords</label>
      <div class="keyword-row">
        <input id="keywordInput" placeholder="e.g. hvac">
        <button class="btn-small" onclick="addKeyword()">+ Add</button>
      </div>
      <div class="tags" id="tags"></div>
    </div>

    <div class="field">
      <label>Search From</label>
      <select id="searchFrom" onchange="toggleCity()">
        <option value="pin" selected>PIN — search from business location</option>
        <option value="city">CITY — search keyword + city</option>
      </select>
      <div id="cityBox" style="display:none;margin-top:10px">
        <input id="city" placeholder="e.g. Portland">
        <div class="hint">// city mode searches “keyword + city” from the city center</div>
      </div>
    </div>

    <div class="field">
      <label>Report Language</label>
      <select id="language">
        <option value="en" selected>English</option>
        <option value="sv">Svenska</option>
        <option value="es">Español</option>
      </select>
    </div>
  </div>

  <button id="runBtn" class="btn-run" onclick="runCheck()">▶ Run Rank Check</button>
</div>

<div id="status" class="status"></div>
<div id="error" class="error"></div>

<div id="results" class="results">
  <div id="resultsBody"></div>
</div>
</div>

<script>
const BASE='https://api.apify.com/v2';
const ACTOR='compass~crawler-google-places';
let keywords=[];
let latestAudits=[];

const LANG={
  en:{
    businessOf:(i,t)=>`// BUSINESS ${i} OF ${t}`,
    keyword:k=>`// KEYWORD: "${k.toUpperCase()} "`,
    ranked:(p,t,k)=>`Ranked ${p} of ${t} results for "${k}"`,
    notFound:(t,k)=>`Not found in top ${t} results for "${k}"`,
    you:'◀ YOU',
    checklist:'Profile Optimization Checklist',
    step:'Step',item:'Item',status:'Status',action:'Action Required',
    phone:'Phone',address:'Address',hours:'Opening hours',description:'Business description',openingDate:'Opening date',serviceAreas:'Service areas',photos:'Photos (minimum 10)',logo:'Logo',services:'Services / Products',posts:'Posts / Updates',primaryCategory:'Primary category',secondaryCategories:'Secondary categories (min 3)',titleKeywords:'Keywords in title',reviewsCount:'Reviews count',
    configured:'Configured',missing:'MISSING',empty:'EMPTY',notConfigured:'NOT CONFIGURED',noAreas:'NO AREAS',noLogo:'NO LOGO',none:'NONE',noPosts:'NO POSTS',
    addPhone:'Add phone number to profile',addAddress:'Add correct address',addHours:'Set opening hours',addDescription:'Write description of at least 200 characters',addDate:'Add opening date — Google shows “X years in business”',addAreas:'Add service areas where you work',addPhotos:'Upload more photos — competitors often have 30+',addLogo:'Add professional logo — 720×720px PNG',addServices:'Add services/products',addPosts:'Add regular posts with photos and updates',addSecondary:'Add 3–5 relevant secondary categories',addTitleKeywords:'Consider adding specialty or area to the title',moreReviews:'Need 10+ reviews — set up review request system',
    vs:'#1 comparison',yourProfileVs:'Your profile vs #1',metric:'Metric',youCol:'You',num1:'#1',rating:'Rating',reviews:'Reviews',website:'Website',yes:'Yes',no:'No',categories:'Categories'
  },
  sv:{
    businessOf:(i,t)=>`// FÖRETAG ${i} AV ${t}`,
    keyword:k=>`// SÖKORD: "${k.toUpperCase()} "`,
    ranked:(p,t,k)=>`Placering ${p} av ${t} resultat för "${k}"`,
    notFound:(t,k)=>`Hittades inte i topp ${t} resultat för "${k}"`,
    you:'◀ DU',
    checklist:'Checklista för profiloptimering',
    step:'Steg',item:'Punkt',status:'Status',action:'Åtgärd krävs',
    phone:'Telefon',address:'Adress',hours:'Öppettider',description:'Företagsbeskrivning',openingDate:'Öppningsdatum',serviceAreas:'Serviceområden',photos:'Foton (minst 10)',logo:'Logotyp',services:'Tjänster / Produkter',posts:'Inlägg / Uppdateringar',primaryCategory:'Primär kategori',secondaryCategories:'Sekundära kategorier (minst 3)',titleKeywords:'Sökord i titeln',reviewsCount:'Antal recensioner',
    configured:'Konfigurerat',missing:'SAKNAS',empty:'TOM',notConfigured:'EJ KONFIGURERAT',noAreas:'INGA OMRÅDEN',noLogo:'INGEN LOGO',none:'INGEN',noPosts:'INGA INLÄGG',
    addPhone:'Lägg till telefonnummer',addAddress:'Lägg till korrekt adress',addHours:'Ange öppettider',addDescription:'Skriv en beskrivning på minst 200 tecken',addDate:'Lägg till öppningsdatum — Google visar “X år i branschen”',addAreas:'Lägg till serviceområden där ni arbetar',addPhotos:'Ladda upp fler foton — konkurrenter har ofta 30+',addLogo:'Lägg till professionell logotyp — 720×720px PNG',addServices:'Lägg till tjänster/produkter',addPosts:'Lägg till regelbundna inlägg med bilder och nyheter',addSecondary:'Lägg till 3–5 relevanta sekundära kategorier',addTitleKeywords:'Överväg att lägga till specialitet eller område i titeln',moreReviews:'Sätt upp automatiskt system för recensionsförfrågningar',
    vs:'Din profil vs #1',yourProfileVs:'Din profil vs #1',metric:'Mätvärde',youCol:'Du',num1:'#1',rating:'Betyg',reviews:'Recensioner',website:'Hemsida',yes:'Ja',no:'Nej',categories:'Kategorier'
  },
  es:{
    businessOf:(i,t)=>`// NEGOCIO ${i} DE ${t}`,
    keyword:k=>`// PALABRA CLAVE: "${k.toUpperCase()} "`,
    ranked:(p,t,k)=>`Posición ${p} de ${t} resultados para "${k}"`,
    notFound:(t,k)=>`No encontrado en top ${t} para "${k}"`,
    you:'◀ USTED',
    checklist:'Checklist de optimización del perfil',
    step:'Paso',item:'Ítem',status:'Estado',action:'Acción requerida',
    phone:'Teléfono',address:'Dirección',hours:'Horarios',description:'Descripción del negocio',openingDate:'Fecha de apertura',serviceAreas:'Áreas de servicio',photos:'Fotos (mínimo 10)',logo:'Logo',services:'Servicios / Productos',posts:'Publicaciones / Actualizaciones',primaryCategory:'Categoría principal',secondaryCategories:'Categorías secundarias (mín 3)',titleKeywords:'Keywords en el título',reviewsCount:'Cantidad de reseñas',
    configured:'Configurado',missing:'FALTA',empty:'VACÍA',notConfigured:'NO CONFIGURADA',noAreas:'SIN ÁREAS',noLogo:'SIN LOGO',none:'NINGUNA',noPosts:'SIN PUBLICACIONES',
    addPhone:'Agregar teléfono al perfil',addAddress:'Agregar dirección correcta',addHours:'Configurar horarios',addDescription:'Escribir descripción de mínimo 200 caracteres',addDate:'Agregar fecha de apertura',addAreas:'Agregar áreas de servicio',addPhotos:'Subir más fotos — competidores suelen tener 30+',addLogo:'Agregar logo profesional — 720×720px PNG',addServices:'Agregar servicios/productos',addPosts:'Agregar publicaciones regulares con fotos',addSecondary:'Agregar 3–5 categorías secundarias relevantes',addTitleKeywords:'Considerar agregar especialidad o zona al título',moreReviews:'Configurar sistema automático de reseñas',
    vs:'Tu perfil vs #1',yourProfileVs:'Tu perfil vs #1',metric:'Métrica',youCol:'Tú',num1:'#1',rating:'Calificación',reviews:'Reseñas',website:'Sitio web',yes:'Sí',no:'No',categories:'Categorías'
  }
};

function t(){return LANG[document.getElementById('language').value]||LANG.en}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function status(msg){const el=document.getElementById('status');el.textContent=msg;el.classList.add('visible')}
function hideStatus(){document.getElementById('status').classList.remove('visible')}
function showError(msg){const el=document.getElementById('error');el.textContent='⚠ '+msg;el.classList.add('visible')}
function clearError(){document.getElementById('error').classList.remove('visible')}
function normalize(s){return String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,'and').replace(/[^a-z0-9]/g,'')}
function parseUrls(raw){return raw.split('\n').map(u=>u.trim()).filter(u=>u.includes('google.com/maps')||u.includes('maps.app.goo.gl')||u.includes('goo.gl/maps')).slice(0,30)}

document.getElementById('urls').addEventListener('input',function(){
  const n=parseUrls(this.value).length;
  document.getElementById('urlCounter').innerHTML=`<span>${n}</span> / 30 URLs`;
});
document.getElementById('keywordInput').addEventListener('keydown',e=>{if(e.key==='Enter')addKeyword()});

function addKeyword(){
  const input=document.getElementById('keywordInput');
  const val=input.value.trim();
  if(!val||keywords.includes(val)){input.value='';return}
  keywords.push(val); input.value=''; renderTags();
}
function removeKeyword(i){keywords.splice(i,1);renderTags()}
function renderTags(){document.getElementById('tags').innerHTML=keywords.map((k,i)=>`<div class="tag">${esc(k)} <button onclick="removeKeyword(${i})">×</button></div>`).join('')}
function toggleCity(){document.getElementById('cityBox').style.display=document.getElementById('searchFrom').value==='city'?'block':'none'}

async function startActor(token,input){
  const res=await fetch(`${BASE}/acts/${ACTOR}/runs?token=${encodeURIComponent(token)}`,{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(input)
  });
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`Apify HTTP ${res.status}`)}
  const j=await res.json(); return j.data;
}
async function pollRun(token,runId,label){
  for(let i=0;i<80;i++){
    await sleep(5000);
    const res=await fetch(`${BASE}/actor-runs/${runId}?token=${encodeURIComponent(token)}`);
    const j=await res.json();
    const s=j.data?.status;
    status(`${label} — ${s} (${(i+1)*5}s)`);
    if(s==='SUCCEEDED')return j.data.defaultDatasetId;
    if(['FAILED','ABORTED','TIMED-OUT'].includes(s))throw new Error(`${label} ${s}`);
  }
  throw new Error(`${label} timed out`);
}
async function fetchDataset(token,datasetId,limit=500){
  const res=await fetch(`${BASE}/datasets/${datasetId}/items?token=${encodeURIComponent(token)}&clean=true&limit=${limit}`);
  return await res.json();
}
async function runActor(token,input,label,limit=500){
  const run=await startActor(token,input);
  const datasetId=await pollRun(token,run.id,label);
  return await fetchDataset(token,datasetId,limit);
}
async function geocodeCity(city){
  const res=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1`);
  const j=await res.json();
  if(!j||!j[0])throw new Error(`Could not geocode city: ${city}`);
  return {lat:Number(j[0].lat),lng:Number(j[0].lon)};
}
function profileLatLng(profile){
  const lat=profile?.location?.lat??profile?.latitude??profile?.lat;
  const lng=profile?.location?.lng??profile?.longitude??profile?.lng;
  if(lat==null||lng==null)return null;
  return {lat:Number(lat),lng:Number(lng)};
}
function canonicalName(s){
  return normalize(String(s||'').replace(/\b(llc|inc|ltd|co|company|corp|corporation|ab|gmbh)\b/gi,' ').replace(/\b(the|of|in|near|at)\b/gi,' ').replace(/\s+/g,' '));
}
function wordMatchScore(a,b){
  const A=canonicalName(a),B=canonicalName(b);
  if(!A||!B)return 0;
  if(A===B)return 1;
  if(A.includes(B)||B.includes(A))return .95;
  const wordsA=String(a||'').toLowerCase().split(/\s+/).map(canonicalName).filter(w=>w.length>2);
  const wordsB=String(b||'').toLowerCase().split(/\s+/).map(canonicalName).filter(w=>w.length>2);
  if(!wordsA.length||!wordsB.length)return 0;
  let hits=0;
  for(const w of wordsA){if(wordsB.some(x=>x===w||x.includes(w)||w.includes(x)))hits++}
  return hits/Math.max(wordsA.length,wordsB.length);
}
function isSameBusinessByName(a,b){return wordMatchScore(a,b)>=0.6}
function isSameBusiness(item,profile){
  const itemPlaceId=item.placeId||item.place_id||item.cid;
  const profilePlaceId=profile.placeId||profile.place_id||profile.cid;
  if(itemPlaceId&&profilePlaceId&&String(itemPlaceId)===String(profilePlaceId))return true;
  return isSameBusinessByName(item.title||item.name||'',profile.title||profile.name||'');
}
function getCategories(item){
  const out=[]; const add=x=>{if(!x)return;if(typeof x==='string')out.push(x.trim());else if(typeof x==='object')out.push(String(x.name||x.title||x.label||x.categoryName||'').trim())};
  if(Array.isArray(item.categories))item.categories.forEach(add);
  if(Array.isArray(item.additionalCategories))item.additionalCategories.forEach(add);
  add(item.categoryName); add(item.category);
  return [...new Set(out.filter(Boolean))];
}
function hasWebsite(item){return !!(item.website&&String(item.website).trim())}
function hasPhone(item){return !!(item.phone||item.phoneUnformatted)}
function hasHours(item){return !!(item.openingHours&&item.openingHours.length)}
function photoCount(item){return item.imageCount||item.imagesCount||item.photosCount||(Array.isArray(item.imageUrls)?item.imageUrls.length:0)||0}
function hasLogo(item){return !!(item.logoUrl||item.logo||item.imageUrl)}
function hasServices(item){return !!(item.services?.length||item.additionalInfo?.Services||item.additionalInfo)}
function hasPosts(item){return !!(item.posts?.length||item.updatesFromCustomers?.length||item.updatesCount)}

function buildChecklist(profile,keyword){
  const L=t();
  const cats=getCategories(profile);
  const titleNorm=normalize(profile.title||profile.name||'');
  const catInTitle=cats.some(c=>titleNorm.includes(normalize(c)))||titleNorm.includes(normalize(keyword||''));
  return [
    {step:'A1',item:L.phone,ok:hasPhone(profile),status:profile.phone||profile.phoneUnformatted||L.missing,action:L.addPhone},
    {step:'A2',item:L.address,ok:!!profile.address,status:profile.address||L.missing,action:L.addAddress},
    {step:'A3',item:L.hours,ok:hasHours(profile),status:L.configured,action:L.addHours},
    {step:'A4',item:L.description,ok:!!(profile.description&&profile.description.length>=120),status:profile.description?L.configured:L.empty,action:L.addDescription},
    {step:'A5',item:L.openingDate,ok:!!(profile.openingDate||profile.yearsInBusiness),status:L.notConfigured,action:L.addDate},
    {step:'A6',item:L.serviceAreas,ok:!!(profile.serviceArea||profile.serviceAreas?.length),status:L.noAreas,action:L.addAreas},
    {step:'A7',item:L.photos,ok:photoCount(profile)>=10,status:`${photoCount(profile)} photos`,action:L.addPhotos},
    {step:'A8',item:L.logo,ok:hasLogo(profile),status:hasLogo(profile)?L.configured:L.noLogo,action:L.addLogo},
    {step:'A9',item:L.services,ok:hasServices(profile),status:hasServices(profile)?L.configured:L.none,action:L.addServices},
    {step:'A10',item:L.posts,ok:hasPosts(profile),status:hasPosts(profile)?L.configured:L.noPosts,action:L.addPosts},
    {step:'B1',item:L.primaryCategory,ok:!!(profile.categoryName||cats[0]),status:profile.categoryName||cats[0]||L.none,action:L.addSecondary},
    {step:'B2',item:L.secondaryCategories,ok:cats.length>=3,status:cats.length>=3?cats.slice(1).join(', '):L.none,action:L.addSecondary},
    {step:'B3',item:L.titleKeywords,ok:catInTitle,status:catInTitle?L.configured:L.missing,action:L.addTitleKeywords},
    {step:'C1',item:L.reviewsCount,ok:Number(profile.reviewsCount||0)>=10,status:String(profile.reviewsCount||0),action:L.moreReviews}
  ];
}

async function runCheck(){
  clearError(); hideStatus(); document.getElementById('results').style.display='none';
  const token=document.getElementById('token').value.trim();
  const urls=parseUrls(document.getElementById('urls').value);
  const searchFrom=document.getElementById('searchFrom').value;
  const city=document.getElementById('city').value.trim();
  const lang=document.getElementById('language').value;

  if(!token)return showError('Apify token is required.');
  if(!urls.length)return showError('Paste at least one Google Maps URL.');
  if(!keywords.length)return showError('Add at least one keyword.');
  if(searchFrom==='city'&&!city)return showError('Enter city or switch back to PIN mode.');

  const btn=document.getElementById('runBtn'); btn.disabled=true;
  try{
    let cityCoords=null;
    if(searchFrom==='city'){status(`Geocoding ${city}`);cityCoords=await geocodeCity(city)}
    const audits=[];

    for(let i=0;i<urls.length;i++){
      const url=urls[i];
      status(`Step 1 — Fetching real Google profile ${i+1}/${urls.length}`);

      const profiles=await runActor(token,{
        startUrls:[{url}],
        maxCrawledPlacesPerSearch:1,
        language:lang,
        maxReviews:0,
        maxImages:0,
        scrapeReviewerInfo:false
      },`Profile ${i+1}/${urls.length}`,20);

      if(!profiles||!profiles[0])throw new Error(`Could not fetch profile for URL ${i+1}`);
      const profile=profiles[0]; if(!profile.url)profile.url=url; profile._inputUrl=url;

      const coords=profileLatLng(profile);
      if(!coords&&!cityCoords)throw new Error(`Could not get coordinates for ${profile.title||url}`);

      const searchLat=cityCoords?cityCoords.lat:coords.lat;
      const searchLng=cityCoords?cityCoords.lng:coords.lng;
      const searchQueries=keywords.map(k=>searchFrom==='city'?`${k} ${city}`:k);

      status(`Step 2 — Searching top 20 for ${profile.title}`);

      const searchResults=await runActor(token,{
        searchStringsArray:searchQueries,
        lat:String(searchLat),
        lng:String(searchLng),
        zoom:searchFrom==='city'?12:14,
        maxCrawledPlacesPerSearch:20,
        language:lang,
        maxReviews:0,
        maxImages:0,
        scrapeReviewerInfo:false,
        scrapeContacts:false,
        exportPlaceUrls:false,
        additionalInfo:false
      },`Search ${i+1}/${urls.length}`,500);

      const byKeyword={};
      for(const kw of keywords)byKeyword[kw]=[];

      for(const item of searchResults||[]){
        const ss=normalize(item.searchString||'');
        let matchedKeyword=null;
        for(let q=0;q<searchQueries.length;q++){
          const queryNorm=normalize(searchQueries[q]);
          const kwNorm=normalize(keywords[q]);
          if(ss===queryNorm||ss.includes(queryNorm)||queryNorm.includes(ss)||ss.includes(kwNorm)){matchedKeyword=keywords[q];break}
        }
        if(!matchedKeyword&&keywords.length===1)matchedKeyword=keywords[0];
        if(matchedKeyword)byKeyword[matchedKeyword].push(item);
      }

      const keywordAudits=[];
      for(const kw of keywords){
        const items=(byKeyword[kw]||[]).sort((a,b)=>(a.rank??999)-(b.rank??999)).slice(0,20);
        const ranked=items.map((item,idx)=>({
          pos:idx+1,item,name:item.title||item.name||'(unknown)',
          rating:item.totalScore??item.rating??null,
          reviews:item.reviewsCount??item.reviewCount??null,
          categories:getCategories(item),
          website:hasWebsite(item),
          phone:hasPhone(item),
          hours:hasHours(item),
          isTarget:isSameBusiness(item,profile)
        }));
        let found=false;
        for(const r of ranked){if(r.isTarget&&!found)found=true;else if(r.isTarget)r.isTarget=false}
        const target=ranked.find(r=>r.isTarget);
        keywordAudits.push({
          keyword:kw,
          query:searchFrom==='city'?`${kw} ${city}`:kw,
          ranked,target,found:!!target,position:target?target.pos:null,
          number1:ranked[0]||null
        });
      }
      audits.push({profile,keywordAudits});
    }

    latestAudits=audits;
    hideStatus();
    renderResults(audits);
  }catch(e){hideStatus();showError(e.message)}
  finally{btn.disabled=false}
}

function renderResults(audits){
  const L=t();
  let invisible=0;
  for(const a of audits)for(const k of a.keywordAudits)if(!k.found)invisible++;

  let html=`<div class="summary">// ${audits.length} businesses audited · ${keywords.length} keywords · ${invisible} invisible searches · ${new Date().toLocaleString()}</div>`;

  audits.forEach((audit,idx)=>{
    const p=audit.profile;
    const cats=getCategories(p);
    const checks=buildChecklist(p,audit.keywordAudits[0]?.keyword);
    const passed=checks.filter(c=>c.ok).length;

    html+=`
    <div class="biz-block">
      <div class="biz-head">
        <div>
          <div class="biz-title">${esc(p.title||p.name||'Business')}</div>
          <div class="biz-meta">
            ${esc(p.categoryName||cats[0]||'')} · ${esc(p.address||'No address')} · ${esc(p.phone||'No phone')}<br>
            Rating: ${p.totalScore??'—'} · Reviews: ${p.reviewsCount??0} · Website: ${hasWebsite(p)?'Yes':'No'} · Profile score: ${passed}/${checks.length}
          </div>
        </div>
        <button class="btn-pdf" onclick="openBizPdf(${idx})">Open PDF</button>
      </div>
    `;

    for(const ka of audit.keywordAudits){
      const pos=ka.position;
      const rankClass=!pos?'bad':pos<=5?'good':pos<=12?'mid':'bad';
      const display=pos?`#${pos}`:'20+';
      const desc=pos?L.ranked(pos,ka.ranked.length,ka.query):L.notFound(ka.ranked.length,ka.query);

      html+=`
      <div class="keyword-label">${esc(L.keyword(ka.query))}</div>
      <div class="rank-hero">
        <div class="rank-number ${rankClass}">${display}</div>
        <div>
          <div style="font-size:15px;font-weight:800;margin-bottom:4px">${esc(p.title||'Business')}</div>
          <div class="rank-desc">${esc(desc)}</div>
        </div>
      </div>
      <div class="list">
        ${ka.ranked.map(r=>`
          <div class="row ${r.isTarget?'target':''}">
            <div class="pos">${r.pos}</div>
            <div class="name">${esc(r.name)}${r.isTarget?' '+esc(L.you):''}</div>
            <div class="rating">${r.rating!=null?'★ '+Number(r.rating).toFixed(1)+(r.reviews?' ('+r.reviews+')':''):''}</div>
          </div>`).join('')}
        ${!ka.target?`<div class="notfound">✕ ${esc(p.title||'Business')} — not found in top results</div>`:''}
      </div>`;
    }

    html+=`
      <div class="keyword-label">// profile optimization checklist</div>
      <div class="checklist">
        <div class="check-row check-head"><div>${esc(L.item)}</div><div>${esc(L.status)}</div><div>${esc(L.action)}</div></div>
        ${checks.map(c=>`
          <div class="check-row">
            <div>${esc(c.step)} ${esc(c.item)}</div>
            <div>${c.ok?`<span class="ok">✓ ${esc(c.status)}</span>`:`<span class="no">✗ ${esc(c.status)}</span>`}</div>
            <div>${c.ok?'—':esc(c.action)}</div>
          </div>`).join('')}
      </div>
    </div>`;
  });

  document.getElementById('resultsBody').innerHTML=html;
  document.getElementById('results').style.display='block';
  document.getElementById('results').scrollIntoView({behavior:'smooth'});
}

function openBizPdf(index){
  const audit=latestAudits[index];
  if(!audit)return;
  const html=buildPdfHtml(audit,index,latestAudits.length);
  const title=(audit.profile.title||'Rank Report').replace(/[<>:"/\\|?*]+/g,'');
  const win=window.open('','_blank');
  win.document.write(html);
  win.document.close();
  win.document.title=`${title} — Rank Report`;
}

function pdfStatus(ok,status){
  return ok?`<span class="green">✓ ${esc(status)}</span>`:`<span class="red">✗ ${esc(status)}</span>`;
}

  const rankDisplay=pos?`#${pos}`:'20+';

  return `<!DOCTYPE html>

</style>
</head>
<body>

<div class="page">
  <div class="topline"><span>${esc(now)}</span><span>${title} — Rank Report</span></div>
  <h1>${esc(L.businessOf(index+1,total))}<br>${title}</h1>
  <div class="keyword">${esc(L.keyword(query))}</div>
  <div class="rankbox">
    <div class="rank">${esc(rankDisplay)}</div>
    <div>
      <div class="rank-title">${title}</div>
      <div class="muted">${esc(desc)}</div>
    </div>
  </div>
  <table class="results">
    ${(ka?.ranked||[]).slice(0,20).map(r=>`
      <tr class="${r.isTarget?'target':''}">
        <td class="pos">${r.pos}</td>
        <td>${esc(r.name)}${r.isTarget?' '+esc(L.you):''}</td>
        <td class="rating">${r.rating!=null?'★ '+Number(r.rating).toFixed(1)+(r.reviews?' ('+r.reviews+')':''):''}</td>
      </tr>`).join('')}
  </table>
  <div class="footer"><span>about:blank</span><span>1/2</span></div>
</div>

<div class="page">
  <div class="topline"><span>${esc(now)}</span><span>${title} — Rank Report</span></div>
  <h2>${esc(L.checklist)}</h2>

    <tbody>
      ${checks.map(c=>`
