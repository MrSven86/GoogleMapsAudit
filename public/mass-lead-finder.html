<script>
let businesses = [];

function normalizeUrl(url) {
  if (!url) return '';
  try {
    const u = new URL(String(url).trim());
    u.hash = '';
    u.search = '';
    u.hostname = u.hostname.replace(/^www\./i, '').toLowerCase();
    return u.toString().replace(/\/$/, '').toLowerCase();
  } catch {
    return String(url).trim().replace(/\/$/, '').toLowerCase();
  }
}

function dedupeUrlList(urls) {
  const seen = new Set();
  const out = [];
  for (const raw of urls) {
    const n = normalizeUrl(raw);
    if (!n || seen.has(n)) continue;
    seen.add(n);
    out.push(n);
  }
  return out;
}

function hostOf(url) {
  try { return new URL(url).hostname.replace(/^www\./, '').toLowerCase(); }
  catch { return ''; }
}

function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email || '').trim());
}

function pickBestEmail(emails) {
  const valid = (emails || []).filter(isValidEmail);
  return valid[0] || '';
}

async function run() {
  const token = document.getElementById('apifyToken').value.trim();
  const keyword = document.getElementById('keyword').value.trim();
  const city = document.getElementById('city').value.trim();
  const state = document.getElementById('state').value.trim().toUpperCase();
  const maxResults = parseInt(document.getElementById('maxResults').value, 10) || 100;
  const btn = document.getElementById('runBtn');

  btn.disabled = true;
  btn.textContent = 'Running...';
  businesses = [];
  clearLog();

  try {
    log('Step 1/3: Searching Google Maps...', 'info');
    const gmapsRunId = await startRun('gmaps', { apifyToken: token, keyword, city, state, maxResults });
    const gmapsDataset = await pollRun(gmapsRunId, token, 'Google Maps');
    const gmapsItems = await fetchDataset(gmapsDataset, token);

    businesses = gmapsItems.map(x => {
      const facebook = (x.facebooks && x.facebooks[0]) || '';
      return {
        name: x.title || x.name || '',
        phone: x.phone || x.phoneNumber || '',
        website: x.website || '',
        websiteHost: x.website ? hostOf(x.website) : '',
        facebook: facebook || '',
        fbNormalized: facebook ? normalizeUrl(facebook) : '',
        gbpUrl: x.url || '',
        email: '',
        emailSource: '',
        _gmapsEmails: Array.isArray(x.emails) ? x.emails : [],
      };
    }).filter(b => b.name);

    businesses = businesses.filter((b, i, arr) =>
      i === arr.findIndex(x => (x.name + '|' + x.phone).toLowerCase() === (b.name + '|' + b.phone).toLowerCase())
    );

    businesses.forEach(b => {
      const e = pickBestEmail(b._gmapsEmails);
      if (e) {
        b.email = e;
        b.emailSource = 'gmaps';
      }
      delete b._gmapsEmails;
    });

    const websiteTargets = businesses.filter(b => !b.email && b.website);
    if (websiteTargets.length) {
      log(`Step 2/3: Scraping ${websiteTargets.length} websites...`, 'info');
      try {
        const contactRunId = await startRun('contact', {
          apifyToken: token,
          startUrls: dedupeUrlList(websiteTargets.map(b => b.website)),
        });
        const contactDataset = await pollRun(contactRunId, token, 'Contact scraper');
        const contactItems = await fetchDataset(contactDataset, token);

        const emailsByHost = {};
        for (const item of contactItems) {
          const h = hostOf(item.url || '');
          if (!h) continue;
          emailsByHost[h] ||= [];
          if (Array.isArray(item.emails)) emailsByHost[h].push(...item.emails);
        }

        websiteTargets.forEach(b => {
          const e = pickBestEmail(emailsByHost[b.websiteHost] || []);
          if (e) {
            b.email = e;
            b.emailSource = 'website';
          }
        });
      } catch (e) {
        log(`Website step failed: ${e.message}`, 'error');
      }
    }

    const fbTargets = businesses.filter(b => !b.email && b.facebook);
    if (fbTargets.length) {
      log(`Step 3/3: Scraping ${fbTargets.length} Facebook pages...`, 'info');
      try {
        const fbStartUrls = dedupeUrlList(fbTargets.map(b => b.facebook));
        const fbRunId = await startRun('facebook', {
          apifyToken: token,
          startUrls: fbStartUrls,
        });
        const fbDataset = await pollRun(fbRunId, token, 'Facebook scraper');
        const fbItems = await fetchDataset(fbDataset, token);

        const emailByFbUrl = {};
        for (const item of fbItems) {
          const k = normalizeUrl(item.pageUrl || item.url || '');
          if (!k) continue;
          const e = pickBestEmail([item.email, ...(Array.isArray(item.emails) ? item.emails : [])]);
          if (e) emailByFbUrl[k] = e;
        }

        fbTargets.forEach(b => {
          const e = emailByFbUrl[b.fbNormalized];
          if (e) {
            b.email = e;
            b.emailSource = 'facebook';
          }
        });
      } catch (e) {
        log(`Facebook step failed: ${e.message}`, 'error');
      }
    }

    renderResults();
    updateStats();
    exportXLSX();
    log('✓ Done. Excel exported.', 'success');
  } catch (e) {
    log(`✗ Fatal error: ${e.message}`, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Find Leads';
  }
}
</script>
